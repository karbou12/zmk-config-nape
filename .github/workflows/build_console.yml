name: Build ZMK firmware for nape console
on:
  push:
    branches-ignore:
      - my/develop
    paths:
      - 'boards/shields/nape/Kconfig.*'
      - 'boards/shields/nape/nape.zmk.yml'
      - 'boards/shields/nape/nape_common.overlay'
      - 'boards/snippets/**'
      - 'src/**'
      - 'zephyr/**'
      - 'CMakeLists.txt'
      - 'boards/shields/nape/nape_console.*'
      - 'config_console/**'
      - 'build_console.yaml'
      - '.github/workflows/build_console.yml'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@9ebbeff0a8b69a42f14aec022cdf16c7a107b9e0
    with:
      config_path: "config_console"
      build_matrix_path: "build_console.yaml"
