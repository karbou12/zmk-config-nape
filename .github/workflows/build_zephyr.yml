name: Build ZMK firmware of the latest version
on:
  push:
    branches-ignore:
      - my/develop
    paths:
      - 'boards/shields/nape/Kconfig.*'
      - 'boards/shields/nape/nape.zmk.yml'
      - 'boards/shields/nape/nape_common.overlay'
      - 'boards/snippets/**'
      - 'src/**'
      - 'zephyr/**'
      - 'CMakeLists.txt'
      - 'boards/shields/nape/nape_zephyr.*'
      - 'config_zephyr/**'
      - 'build_zephyr.yaml'
      - '.github/workflows/build_zephyr.yml'
  pull_request:
  workflow_dispatch:

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@main
    with:
      config_path: "config_zephyr"
      build_matrix_path: "build_zephyr.yaml"
